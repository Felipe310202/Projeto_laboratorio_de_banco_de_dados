{% extends 'base.html' %}{% block corpo %}
<h2>{{ 'Editar' if id else 'Novo' }} mecanico</h2>
<form method="post">
 <label>Nome *</label><input name="nome" value="{{ item.nome or '' }}" required>
 <label>Especialidade</label><input name="especialidade" value="{{ item.especialidade or '' }}">
 <label>Supervisor</label><select name="id_supervisor"><option value="">(nenhum)</option>
 {% for s in supervisores %}<option value="{{ s.id_mecanico }}" {% if item.id_supervisor|string == s.id_mecanico|string %}selected{% endif %}>{{ s.nome }}</option>{% endfor %}
 </select>
 <label>Tipo *</label>
 {% if id %}<input type="hidden" name="tipo" value="{{ item.tipo }}"><b>{{ item.tipo }}</b> (o tipo nao muda depois do cadastro)
 {% else %}<select name="tipo"><option value="interno">Interno</option><option value="terceirizado" {% if item.tipo == 'terceirizado' %}selected{% endif %}>Terceirizado</option></select>{% endif %}
 <fieldset style="margin-top:10px"><legend>Se interno</legend>
  <label>Matricula</label><input name="matricula" value="{{ item.matricula or '' }}">
  <label>Salario (R$)</label><input name="salario" type="number" step="0.01" value="{{ item.salario or '' }}">
  <label>Data de contratacao</label><input name="data_contratacao" type="date" value="{{ item.data_contratacao or '' }}">
 </fieldset>
 <fieldset style="margin-top:10px"><legend>Se terceirizado</legend>
  <label>Empresa parceira</label><select name="id_empresa">
  {% for e in empresas %}<option value="{{ e.id_empresa }}" {% if item.id_empresa|string == e.id_empresa|string %}selected{% endif %}>{{ e.nome }}</option>{% endfor %}
  </select>
  <label>Valor/hora padrao (R$)</label><input name="valor_hora_padrao" type="number" step="0.01" value="{{ item.valor_hora_padrao or '' }}">
 </fieldset>
 <br><button>Salvar</button> <a href="{{ url_for('mecanicos') }}">Cancelar</a>
</form>{% endblock %}
