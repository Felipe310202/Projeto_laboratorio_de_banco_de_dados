{% extends 'base.html' %}{% block corpo %}
<h2>{{ 'Editar' if id else 'Novo' }} cliente</h2>
<form method="post">
 <label>Nome *</label><input name="nome" value="{{ item.nome or '' }}" required>
 <label>CPF/CNPJ * (so numeros)</label><input name="cpf_cnpj" value="{{ item.cpf_cnpj or '' }}" required>
 <label>Telefone</label><input name="telefone" value="{{ item.telefone or '' }}">
 <label>E-mail</label><input name="email" value="{{ item.email or '' }}">
 <label>Endereco</label><input name="endereco" value="{{ item.endereco or '' }}">
 <br><button>Salvar</button> <a href="{{ url_for('clientes') }}">Cancelar</a>
</form>{% endblock %}
